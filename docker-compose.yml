# fbhttp gateway, plain HTTP behind a reverse proxy that does TLS (nginx, or
# the Coolify proxy). Configuration comes from FBHTTP_* variables: set them in
# a .env file next to this file (see .env.example) or in the Coolify UI.
# Then: docker compose up -d
services:
  gateway:
    build: ./gateway
    platform: linux/amd64
    image: fbhttp-gateway:latest
    restart: unless-stopped
    environment:
      FBHTTP_PLAIN_HTTP: "true"
      FBHTTP_LISTEN: ":8080"
      # Firebird server ("host" or "host/port"). The database the client sends
      # (path or databases.conf alias) is opened there; its host is ignored.
      FBHTTP_FIREBIRD_HOST: ${FBHTTP_FIREBIRD_HOST:?set FBHTTP_FIREBIRD_HOST}
      # Optional names that go elsewhere: name=host:/path.fdb;other=host:alias
      FBHTTP_ALIASES: ${FBHTTP_ALIASES:-}
      # Reverse proxy addresses allowed to send X-Real-IP.
      FBHTTP_TRUSTED_PROXIES: ${FBHTTP_TRUSTED_PROXIES:-127.0.0.1,172.16.0.0/12,10.0.0.0/8}
      FBHTTP_MAX_SESSIONS: ${FBHTTP_MAX_SESSIONS:-500}
      FBHTTP_MAX_SESSIONS_PER_IP: ${FBHTTP_MAX_SESSIONS_PER_IP:-50}
      FBHTTP_IDLE_TIMEOUT_SECONDS: ${FBHTTP_IDLE_TIMEOUT_SECONDS:-600}
    ports:
      # Published on all interfaces so an nginx container reaches it at
      # 172.17.0.1:8080. Docker bypasses ufw: block 8080 in the external firewall.
      - "8080:8080"
    # Time to roll back open transactions after SIGTERM (shutdown_grace_seconds + margin).
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
