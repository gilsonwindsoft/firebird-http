; Copy to ws-fbclient.ini in the same folder as ws-fbclient.dll.
; Every key can be overridden by an environment variable (FBHTTP_URL, ...).
[gateway]
url=https://gateway.example.com:8443
connect_timeout_ms=10000
response_timeout_ms=1800000
fetch_rows=200
inline_blob_bytes=65536
keepalive_seconds=300
; Test networks only:
allow_plain_http=0
allow_invalid_certificate=0
