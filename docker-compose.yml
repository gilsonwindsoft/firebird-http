# fbhttp gateway, plain HTTP behind an nginx reverse proxy that does TLS.
# Before the first start: cp deploy/config.example.json deploy/config.json
# and edit the aliases. Then: docker compose up -d
services:
  gateway:
    build: ./gateway
    platform: linux/amd64
    image: fbhttp-gateway:latest
    restart: unless-stopped
    environment:
      FBHTTP_CONFIG: /etc/fbhttp/config.json
    ports:
      # Only nginx on this host reaches the gateway. If nginx runs on another
      # host, publish "8080:8080" and firewall the port to that host only.
      - "127.0.0.1:8080:8080"
    volumes:
      # create_host_path: false makes a missing file fail instead of becoming a directory.
      - type: bind
        source: ./deploy/config.json
        target: /etc/fbhttp/config.json
        read_only: true
        bind:
          create_host_path: false
    # Time to roll back open transactions after SIGTERM (shutdown_grace_seconds + margin).
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
