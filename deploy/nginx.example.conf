# nginx in front of the fbhttp gateway. Copy to /etc/nginx/conf.d/fbhttp.conf,
# set server_name and the certificate paths, then: nginx -t && systemctl reload nginx

upstream fbhttp_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gateway.example.com;

    ssl_certificate     /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Same as FBHTTP_MAX_BODY_BYTES (64 MB default).
    client_max_body_size 64m;

    location / {
        proxy_pass http://fbhttp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The gateway counts sessions per client IP from this header
        # (only when the request comes from an address in FBHTTP_TRUSTED_PROXIES).
        proxy_set_header X-Real-IP $remote_addr;

        # A long SQL statement keeps the request open. Match response_timeout_ms
        # of ws-fbclient.ini (30 min by default).
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
