# Integration environment: Firebird + gateway (plain HTTP) + Go test runner.
#   FB_VERSION=5 docker compose -f docker-compose.test.yml run --rm tests
#   FB_VERSION=5 docker compose -f docker-compose.test.yml up -d firebird gateway
# Firebird 3 and 4 images are amd64 only. On Apple Silicon: colima start --vz-rosetta
# and FB_PLATFORM=linux/amd64.
services:
  firebird:
    image: firebirdsql/firebird:${FB_VERSION:-5}
    # FB 3 and 4 images are amd64 only; on arm64 hosts set FB_PLATFORM=linux/amd64.
    platform: ${FB_PLATFORM:-}
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    ports:
      - "3050:3050"

  gateway:
    build: ./gateway
    image: fbhttp-gateway:latest
    environment:
      FBHTTP_PLAIN_HTTP: "true"
      FBHTTP_LISTEN: ":8080"
      FBHTTP_ALIASES_FILE: /config/aliases.conf
      FBHTTP_DEBUG_SQL: "${FBHTTP_DEBUG_SQL:-0}"
    volumes:
      - ./tests/gateway-config:/config:ro
    ports:
      - "8080:8080"
    depends_on:
      - firebird

  tests:
    build:
      context: ./gateway
      target: build
    working_dir: /src
    command: ["go", "test", "-count=1", "-timeout=20m", "./..."]
    environment:
      FBHTTP_TEST_DB: firebird:/var/lib/firebird/data/test.fdb
      FBHTTP_TEST_USER: SYSDBA
      FBHTTP_TEST_PASSWORD: masterkey
      FBHTTP_TEST_GATEWAY_URL: ${FBHTTP_TEST_GATEWAY_URL:-}
    volumes:
      - ./gateway:/src
      - ./tests:/tests
    depends_on:
      - firebird
