; Optional. Copy to ws-fbclient.ini in the same folder as ws-fbclient.dll.
; Without url, the gateway is https://<host> from the connection Database
; (fb.windsoft.me:alias). With url, the Database host is ignored.
; Every key can be overridden by an environment variable (FBHTTP_URL, ...).
[gateway]
; Public HTTPS address of the nginx in front of the gateway, without a trailing slash.
url=https://gateway.example.com
connect_timeout_ms=10000
response_timeout_ms=1800000
fetch_rows=5000
inline_blob_bytes=65536
keepalive_seconds=120
; Prepared statements remembered per connection: a repeated SQL costs one
; request (prepare and execute together). 0 disables. After a schema change
; the next execution of a cached SQL fails once ("statement description changed").
prepare_cache=256
; Commit/rollback of a transaction that only read goes with the next request
; or after deferred_flush_ms idle. Set 0 if a selectable procedure writes.
defer_readonly_commit=1
deferred_flush_ms=1000
; Test networks only:
allow_plain_http=0
allow_invalid_certificate=0
